# Keyless Loader composition used by tests/loader-smoke.mjs.
# It mounts the public Session, Agent, tool, Code Runtime, Credentials, Settings,
# and JSON-backed storage/domain services. Search Enhance contributes the fixed
# search_tools/search_call gateway; deferred operations never enter ctx.tools.
- id: storage
  name: '@deepseek-ai/dsh-storage'
- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.env.DSH_HOME + '/search-enhance-storage'
- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- id: sessions
  name: '@deepseek-ai/dsh-session'
- id: agents
  name: '@deepseek-ai/dsh-agent'
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'
  config:
    computeMs: 1000
    maxWallMs: 5000
    maxOutputBytes: 65536
    maxOldGenerationSizeMb: 64
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    watch: false
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    watch: false
- id: search-enhance
  name: dsh-search-enhance
